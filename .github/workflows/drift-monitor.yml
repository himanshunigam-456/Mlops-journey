name: Drift Monitor

# Runs the drift detection pipeline on a daily schedule.
#
# Two-layer design:
#   1. Always validate the drift detection code itself (pytest). This is a
#      canary — if Evidently or our wrapper breaks, we know within 24 hrs,
#      not whenever someone next runs `make p3-check` manually.
#   2. If production secrets (MinIO + MLflow credentials) are configured as
#      repo secrets, run the real drift check against last 7 days of captured
#      predictions and open a GitHub issue on threshold breach.
#
# To enable the production check, add these repo secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, MLFLOW_S3_ENDPOINT_URL,
#   MLFLOW_TRACKING_URI
# pointing at a deployed MLflow + S3-compatible bucket. Without them, the
# workflow runs the sanity layer only.

on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST daily (UTC+5:30)
  workflow_dispatch:
  push:
    paths:
      - 'project-1-credit-risk-pipeline/src/credit_risk/drift/**'
      - 'project-1-credit-risk-pipeline/scripts/drift_check.py'
      - '.github/workflows/drift-monitor.yml'

permissions:
  contents: read
  issues: write

jobs:
  drift-monitor:
    runs-on: ubuntu-latest
    env:
      # GHA can't evaluate `secrets.*` directly inside step `if:` conditions,
      # so we project the secret's presence into a boolean env var that step
      # conditions CAN read.
      HAS_PROD_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install uv and project
        run: |
          pip install uv
          uv pip install --system -e "./project-1-credit-risk-pipeline[dev]"

      - name: Sanity — drift detection code passes its own tests
        run: |
          pytest project-1-credit-risk-pipeline/tests/test_drift_reporter.py \
                 project-1-credit-risk-pipeline/tests/test_drift_capture.py -v

      - name: Probe production drift (if MinIO secrets configured)
        id: prod_check
        if: env.HAS_PROD_SECRETS == 'true'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python project-1-credit-risk-pipeline/scripts/drift_check.py \
            --threshold 0.30 --days 7

      - name: Note when production check is skipped
        if: env.HAS_PROD_SECRETS != 'true'
        run: |
          echo "Production drift check skipped — no AWS_ACCESS_KEY_ID secret configured."
          echo "Sanity layer (drift code tests) ran successfully above."
          echo "To enable production checks, configure AWS_ACCESS_KEY_ID,"
          echo "AWS_SECRET_ACCESS_KEY, MLFLOW_S3_ENDPOINT_URL, MLFLOW_TRACKING_URI."

      - name: Open issue on drift breach
        if: steps.prod_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[drift] credit-risk-classifier drift detected — ${today}`,
              labels: ['drift', 'automated'],
              body: [
                `**Drift detected on ${today}.**`,
                ``,
                `The daily drift check found that more than 30% of features have`,
                `drifted between the training reference and the last 7 days of`,
                `production scoring.`,
                ``,
                `**Next steps:**`,
                `1. Inspect the report at \`s3://reports/latest.html\` or`,
                `   \`http://<host>:8000/drift\` in the deployed environment.`,
                `2. Triage which features drifted — campaign effect, data source`,
                `   change, real customer-mix shift?`,
                `3. If shift is genuine, retrain the model and roll out the new`,
                `   version through the canary deployment path.`,
                ``,
                `[Workflow run ↗](${runUrl})`,
              ].join('\n'),
            });
